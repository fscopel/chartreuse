# Builds every platform's release with `cargo xtask release` and attaches the
# archives to the GitHub release with `cargo xtask upload-release`. Like CI, it
# runs nothing but `cargo xtask` commands after checkout and toolchain setup.
#
# - `release: created` fires when a release (or pre-release) is published
#   without first being saved as a draft; GitHub does not run workflows for
#   drafts. See "Cutting a release" in the README.
# - Running it by hand (workflow_dispatch) is a dry run: it builds every
#   platform and keeps the archives as workflow artifacts, uploading nothing
#   to a release.
name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    # bash on every runner, so "$RELEASE_TAG" means the same thing on Windows.
    shell: bash

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      # Empty for manual runs, which build the selected branch.
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Installs packaging tools the runner lacks (Windows: Inno Setup); a
      # no-op where there are none.
      - run: cargo xtask ci-install-tools
      # macOS: imports the Developer ID identity into a temporary keychain.
      # Until the CHARTREUSE_SIGN_P12_BASE64 secret exists it does nothing (the
      # xtask decides, so the workflow holds no logic). See "Release signing
      # secrets" in the README.
      - if: runner.os == 'macOS'
        run: cargo xtask ci-keychain --skip-if-unset
        env:
          CHARTREUSE_SIGN_P12_BASE64: ${{ secrets.CHARTREUSE_SIGN_P12_BASE64 }}
          CHARTREUSE_SIGN_P12_PASSWORD: ${{ secrets.CHARTREUSE_SIGN_P12_PASSWORD }}
          CHARTREUSE_RELEASE_SIGN_IDENTITY: ${{ secrets.CHARTREUSE_RELEASE_SIGN_IDENTITY }}
      # `--allow-ad-hoc` matters on macOS while the CHARTREUSE_RELEASE_SIGN_IDENTITY
      # secret is unset (the app is then signed ad-hoc, nothing is notarized,
      # and the disk image is named `-unsigned`; once the identity is set,
      # missing notarization secrets fail the job), and on Windows while
      # CHARTREUSE_WINDOWS_SIGN_PFX_BASE64 is unset (nothing is signed and the
      # names end in `-unsigned`). Each job ignores the other's secrets.
      - run: cargo xtask release --allow-ad-hoc
        env:
          CHARTREUSE_RELEASE_SIGN_IDENTITY: ${{ secrets.CHARTREUSE_RELEASE_SIGN_IDENTITY }}
          CHARTREUSE_NOTARY_KEY: ${{ secrets.CHARTREUSE_NOTARY_KEY }}
          CHARTREUSE_NOTARY_KEY_ID: ${{ secrets.CHARTREUSE_NOTARY_KEY_ID }}
          CHARTREUSE_NOTARY_ISSUER: ${{ secrets.CHARTREUSE_NOTARY_ISSUER }}
          CHARTREUSE_WINDOWS_SIGN_PFX_BASE64: ${{ secrets.CHARTREUSE_WINDOWS_SIGN_PFX_BASE64 }}
          CHARTREUSE_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.CHARTREUSE_WINDOWS_SIGN_PFX_PASSWORD }}
          CHARTREUSE_WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.CHARTREUSE_WINDOWS_SIGN_TIMESTAMP_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: chartreuse-${{ matrix.name }}
          path: target/dist/
          if-no-files-found: error
      - if: github.event_name == 'release'
        run: cargo xtask upload-release "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
