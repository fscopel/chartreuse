[package]
name = "chartreuse"
description = "Chartreuse screenshot and annotation tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chartreuse-config.workspace = true
chartreuse-core.workspace = true
chartreuse-editor.workspace = true
chartreuse-imaging.workspace = true
chartreuse-overlay.workspace = true
chartreuse-platform.workspace = true
iced.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Local time for saved file names.
chrono = { workspace = true, features = ["clock"] }
# Command-line parsing (`cli`); no color or suggestions.
clap = { version = "4.6.6", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "usage",
] }

# The per-user folder of the single-instance socket (`ipc`).
[target.'cfg(unix)'.dependencies]
dirs.workspace = true

# The single-instance named pipe (`ipc`), letting the instance come to the
# front for a command, and closing a console the instance was given of its
# own (`lib.rs`).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
futures.workspace = true
# Tests inspect the actions a `Task` performs (e.g. that Quit exits); iced does
# not re-export `task::into_stream`. Same version as `iced`.
iced_runtime = "=0.14.0"
tempfile.workspace = true

# Compiles build.rs's resource script (the app icon) with the Windows SDK's
# rc.exe, which it locates like the MSVC toolchain does. `winresource` does the
# same behind a larger, metadata-generating API; one icon needs neither that
# nor a hand-written SDK search. Build dependencies follow the host, so only a
# Windows host builds it.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"

[features]
# Build the release flavor (see `chartreuse_core::flavor`). Set by
# `cargo xtask release` only.
release-flavor = ["chartreuse-core/release-flavor"]

[lints]
workspace = true
