[package]
name = "chartreuse-platform"
description = "Chartreuse platform traits and per-OS backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chartreuse-core.workspace = true
futures.workspace = true
parking_lot.workspace = true
raw-window-handle = "0.6.2"
tracing.workspace = true

# The shared macOS bindings (see the workspace manifest). Declared up front so the
# macOS tracks never need to edit this file.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
# `NSSavePanel.allowedContentTypes` (UTType) is behind this feature.
objc2-app-kit = { workspace = true, features = ["objc2-uniform-type-identifiers"] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-screen-capture-kit.workspace = true
# `SMAppService`: the app as its own login item.
objc2-service-management.workspace = true
objc2-uniform-type-identifiers.workspace = true

[target.'cfg(windows)'.dependencies]
chartreuse-imaging.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux and other free Unix desktops. Everything here is pure Rust or loads its
# system library at run time, so building needs no `-dev` packages.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Decoding the tray icons and portal screenshots, and resampling screenshots
# onto displays.
chartreuse-imaging.workspace = true
# The clipboard: X11 selections served from a thread over x11rb, and the
# Wayland data-control protocols (wl-clipboard-rs); images exchanged as PNG.
arboard = { version = "3.6.1", default-features = false, features = [
    "image-data",
    "wayland-data-control",
] }
# XDG desktop portals (FileChooser, Screenshot, GlobalShortcuts), over zbus.
# `async-io` runs zbus on the async-io runtime iced's Linux theme detection
# already pulls in, instead of adding tokio.
ashpd = { version = "0.13.13", default-features = false, features = [
    "async-io",
    "file_chooser",
    "global_shortcuts",
    "screenshot",
] }
# The StatusNotifierItem tray, over the same zbus runtime; `blocking` runs its
# service on its own thread.
ksni = { version = "0.3.6", default-features = false, features = [
    "async-io",
    "blocking",
] }
# Maps the MIT-SHM segments the X server shares for ShmGetImage.
memmap2 = "0.9.11"
# Wayland output enumeration. The client library is loaded at run time
# (winit enables wayland-backend's `dlopen`); xdg-output is in `unstable`.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
# The pure-Rust X11 connection, with the extensions the X11 backend uses.
x11rb = { version = "0.13.2", features = [
    "composite",
    "randr",
    "resource_manager",
    "shm",
    "xkb",
] }

[dev-dependencies]
chartreuse-imaging.workspace = true
tempfile.workspace = true

[lints]
workspace = true
